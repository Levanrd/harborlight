<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harborlight responsive HUD check</title>
<style>body{margin:0;background:#102d47;color:#d4eafa;font:13px system-ui;text-align:center}header{height:40px;display:flex;align-items:center;justify-content:center;gap:12px}button{background:#deeffa;color:#245979;border:0;border-radius:5px;padding:5px 12px;cursor:pointer}iframe{display:block;width:390px;height:660px;border:1px solid #739db7;margin:auto;max-width:100%}</style>
<header>Harborlight · viewport check <button data-width="390">Phone · 390</button><button data-width="820">Tablet · 820</button><button data-width="1200">Desktop · 1200</button></header>
<iframe title="City preview" src="/"></iframe>
<script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>document.querySelector('iframe').style.width=button.dataset.width+'px'));</script>
</html>
