<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harborlight · People study</title>
<style>body{margin:0;overflow:hidden;background:#b6c5cf;color:#24415b;font:13px system-ui}canvas{display:block}header{position:absolute;top:16px;left:20px;background:#f5fbfff0;padding:14px 20px;border-radius:12px;max-width:590px}h1{margin:4px 0 8px;font-size:22px}p{font-size:12px;margin:5px 0 12px}button{background:#dfedf7;color:#285e82;border:1px solid #b8cedd;border-radius:7px;padding:8px 12px;cursor:pointer}output{display:block;margin-top:10px;font-variant-numeric:tabular-nums}</style>
<style>@media(max-width:700px){header{left:8px;top:8px;padding:8px 10px;max-width:calc(100% - 36px)}header p,header small{display:none}h1{font-size:15px;margin:0 0 6px}button{padding:5px 8px;font-size:11px}output{font-size:10px}}</style>
<header><small>HARBORLIGHT / PEOPLE STUDY</small><h1>People at human scale.</h1><p>Actual city models · drag to orbit · scroll to zoom. This preview never reads or writes saved cities.</p><button id="lineup">Lineup</button> <button id="close">Close-up</button> <button id="face">Face study</button> <button id="walk">Pause walking</button> <button id="crowd">Crowd · 270</button><output id="stats"></output></header>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {PedestrianModels} from '/src/pedestrianModels.ts';import {emptyFootTraffic} from '/src/pedestrians.ts';import {emptyTraffic} from '/src/traffic.ts';import {createCity} from '/src/simulation.ts';
if(!import.meta.env.DEV)throw Error('Local development preview only');
const scene=new THREE.Scene();scene.background=new THREE.Color('#b6c5cf');const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.05,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=1.3;controls.maxDistance=100;
scene.add(new THREE.HemisphereLight('#d8e9ff','#687166',2));const sun=new THREE.DirectionalLight('#fff0dc',2.8);sun.position.set(-4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16});sun.shadow.normalBias=.02;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:'#9aa8ac',roughness:.96}));floor.rotation.x=-Math.PI/2;floor.position.y=.43;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(60,60,'#76888f','#a5b2b5');grid.position.y=.435;scene.add(grid);
const city=createCity(false,'People preview');city.cells={};const traffic=emptyTraffic(),models=new PedestrianModels(scene);let count=8,clock=0,playing=true,last=0,frames=0,start=0;
const lineup=()=>{count=8;camera.position.set(4,3.2,8);controls.target.set(0,1.2,0);};lineup();
document.getElementById('lineup').onclick=lineup;document.getElementById('close').onclick=()=>{count=1;camera.position.set(1.5,1.9,3.7);controls.target.set(0,1.28,0);};document.getElementById('walk').onclick=()=>{playing=!playing;document.getElementById('walk').textContent=playing?'Pause walking':'Resume walking';};document.getElementById('crowd').onclick=()=>{count=270;camera.position.set(14,16,24);controls.target.set(0,0,0);};
document.getElementById('face').onclick=()=>{count=1;camera.position.set(.26,1.53,.64);controls.target.set(0,1.45,0);controls.minDistance=.3;};
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)clock+=dt;const foot=emptyFootTraffic();foot.clock=clock;foot.agents=Array.from({length:count},(_,i)=>({id:i+1,home:'none',destination:'none',path:[],index:0,progress:0,x:count===1?0:count===8?(i%4-1.5)*1.2:(i%18-8.5)*.8,z:count===8?Math.floor(i/4)*1.6:count===1?0:(Math.floor(i/18)-7)*.9,heading:count===8&&i>3?Math.PI/5:0,walked:clock*.85,pace:1,stage:'walking',returning:false,until:0,waiting:false}));models.update(city,foot,traffic,dt,false,camera);controls.update();renderer.render(scene,camera);frames++;if(now-start>1000){document.getElementById('stats').textContent=`${count} people · ${renderer.info.render.calls} scene draw calls · ${renderer.info.render.triangles.toLocaleString()} triangles · ${Math.round(frames*1000/(now-start))} FPS`;frames=0;start=now;}}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
