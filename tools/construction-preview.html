<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harborlight · Construction playtest</title>
<style>header{position:fixed;z-index:9;left:22px;width:285px;top:18px;background:#f5f9f6ef;color:#2e536b;border-radius:12px;padding:15px 19px;font:13px system-ui}header h1{font-size:20px;margin:4px 0 12px}header button{margin:3px 0;padding:7px 10px;border:1px solid #c3d4dd;background:white;color:#2e536b;border-radius:6px;cursor:pointer}header p{font-size:11px;margin:9px 0 0}#inspector{position:fixed;left:22px;top:330px;width:285px;z-index:8;font:13px system-ui}#notice{display:block;margin-top:10px;color:#765d2d}.graphics-control{display:none!important} #ui{position:fixed;z-index:9;left:22px;top:18px;width:285px;max-height:calc(100vh - 36px);overflow:auto;border-radius:12px}#ui header{position:static;width:auto;margin-bottom:10px;padding:15px}#ui header h1{font-size:17px}#ui #inspector{position:static;width:auto}#ui .construction-progress{margin:0 0 10px}#ui header p{display:none}</style>
<div id="root"></div><aside id="ui"><header><small>HARBORLIGHT / UPGRADE CONSTRUCTION</small><h1>From a working building to its next chapter.</h1><button id="home">Start home upgrade</button> <button id="factory">Start factory expansion</button> <button id="pause">Resume</button> <button id="step">Advance 10 seconds</button> <button id="reload">Save & reload fixture</button> <button id="focus">Focus home</button><output id="notice"></output><p>Disposable local neighborhood · actual construction, production and rendering systems · no saved-city access.</p></header><div id="inspector"></div></aside>
<script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {World} from '/src/World.tsx';import {ConstructionProgress} from '/src/ConstructionProgress.tsx';import {useGame} from '/src/store.ts';import {createCity,build,roadPath,decodeCity} from '/src/simulation.ts';import {emptyProduction} from '/src/production.ts';import {emptyClock} from '/src/gameClock.ts';import '/src/style.css';
if(!import.meta.env.DEV)throw Error('Local development preview only');
let city=createCity(false,'Construction study');city.progression.xp=1000;
city=build(city,'road',roadPath({x:-4,z:0},{x:9,z:0})).city;
for(const [kind,x,z]of [['utility',-4,1],['school',-2,1],['clinic',-1,1],['residential',0,1],['fire',1,1],['park',0,-1],['industrial',8,1]])city=build(city,kind,[{x,z}]).city;
city.cells['0,1']={...city.cells['0,1'],age:80,level:2,occupancy:24};city.cells['8,1']={...city.cells['8,1'],age:10,occupancy:16};city.production={...emptyProduction(),inventory:{wood:8,metal:8,stone:8,planks:8,nails:8,bricks:8}};
useGame.getState().set({city,speed:0,lighting:'day',clock:emptyClock(),selected:null,tool:'inspect',notice:'Ready. Start an upgrade, then advance time to inspect the stages.'});
createRoot(document.getElementById('root')).render(React.createElement(World));createRoot(document.getElementById('inspector')).render(React.createElement(React.Fragment,null,React.createElement(ConstructionProgress,{lot:'0,1'}),React.createElement(ConstructionProgress,{lot:'8,1'})));
const focus=(x)=>window.dispatchEvent(new CustomEvent('city-camera',{detail:{focus:{x,z:1}}}));
document.getElementById('home').onclick=()=>{useGame.getState().manageProduction({type:'upgrade',lot:'0,1'});focus(0);};
document.getElementById('factory').onclick=()=>{useGame.getState().manageProduction({type:'factoryUpgrade',factory:'8,1'});focus(8);};
document.getElementById('pause').onclick=()=>{const s=useGame.getState();s.set({speed:s.speed?0:1});};
document.getElementById('step').onclick=()=>{for(let i=0;i<100;i++)useGame.getState().advance(.1);};
document.getElementById('reload').onclick=()=>{const s=useGame.getState(),city=decodeCity(JSON.parse(JSON.stringify(s.city)));s.set({city,notice:'Fixture serialized and reloaded. Project progress retained.'});};
document.getElementById('focus').onclick=()=>focus(0);
setInterval(()=>{const s=useGame.getState();if(s.speed)s.advance(.1*s.speed);const now=useGame.getState();document.getElementById('pause').textContent=now.speed?'Pause':'Resume';document.getElementById('notice').textContent=`${now.notice} · Home level ${now.city.cells['0,1'].level} · Factory tier ${now.city.cells['8,1'].factoryTier||1} · ${now.city.progression.xp} XP`;},100);
</script></html>
