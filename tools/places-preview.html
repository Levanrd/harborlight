<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Harborlight · Living places</title><style>header{position:fixed;top:16px;left:20px;right:20px;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f4f6eef2;border-radius:12px;padding:16px;color:#2b4941;font:13px system-ui}button{padding:8px 12px;background:#fff;border:1px solid #acbdb2;border-radius:6px;color:#2b4941}p{width:100%;margin:2px 0 0;font-size:12px}output{margin-left:auto}</style></head><body><div id="root"></div><header><b>HARBORLIGHT / LIVING PLACES</b><button data-kind="largepark">Garden & fountain</button><button data-kind="playground">Playground</button><button data-kind="sports">Sports</button><button data-kind="clinic">Clinic</button><button data-kind="water">Water tower</button><button data-kind="residential">Homes</button><button data-kind="commercial">Shops</button><button data-kind="airport">Airport</button><button id="pause">Pause</button><button id="night">Day / night</button><output id="status">Local visual tour</output><p>Updated architecture, gardens and everyday activity in a disposable city. Your saved city is untouched.</p></header><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {World} from '/src/World.tsx';import {useGame} from '/src/store.ts';import {createShowcaseCity} from '/src/showcase.ts';import '/src/style.css';
if(!import.meta.env.DEV)throw Error('Local development only');
const city=createShowcaseCity();useGame.getState().set({city,speed:1,lighting:'day',selected:null,tool:'inspect'});createRoot(document.getElementById('root')).render(React.createElement(World));
setInterval(()=>{const s=useGame.getState();s.advance(.1*s.speed);},100);
for(const button of document.querySelectorAll('[data-kind]'))button.onclick=()=>{const kind=button.dataset.kind,c=Object.values(useGame.getState().city.cells).find(c=>c.kind===kind&&(!c.recreationRoot||c.recreationRoot===`${c.x},${c.z}`)&&((kind==='residential'||kind==='commercial')?c.level===1:true));if(c){const large=kind==='largepark',regional=kind==='airport';window.dispatchEvent(new CustomEvent('city-camera',{detail:regional?{focus:{x:c.x+2,z:c.z+1}}:{street:{x:c.x*8+(large?8:kind==='sports'?8:kind==='playground'?4:0),z:c.z*8+(large?8:kind==='sports'||kind==='playground'?4:0)}}}));document.getElementById('status').textContent=button.textContent;}};
document.getElementById('pause').onclick=()=>{const s=useGame.getState();s.set({speed:s.speed?0:1});document.getElementById('pause').textContent=s.speed?'Resume':'Pause';};document.getElementById('night').onclick=()=>{const s=useGame.getState();s.set({lighting:s.lighting==='night'?'day':'night'});};
</script></body></html>
