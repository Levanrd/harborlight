<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harborlight · Street life playtest</title><style>header{position:fixed;top:16px;left:20px;right:20px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f4f6eeed;border-radius:12px;padding:16px;color:#2b4941;font:13px system-ui}header button{border:1px solid #afc0b6;background:white;padding:8px 11px;border-radius:6px;color:#2b4941}header p{width:100%;margin:0;font-size:12px}output{font-size:12px}</style></head><body><div id="root"></div><header><b>HARBORLIGHT / STREET LIFE</b><button id="pause">Pause</button><button id="view">Follow a walker</button><button id="entrance">Watch a doorway</button><button id="overview">Overview</button><button id="night">Day / night</button><output id="stats"></output><p>Disposable local neighborhood. Walking, building visits, crossings and traffic use the real game systems. Saved cities are never read or written.</p></header><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {World} from '/src/World.tsx';import {useGame} from '/src/store.ts';import {createCity} from '/src/simulation.ts';import {advanceTraffic} from '/src/traffic.ts';import {advancePedestrians,pedestrianRoadBlocks,pedestrianCrossings} from '/src/pedestrians.ts';import {buildingEntrance} from '/src/pedestrians.ts';import '/src/style.css';
if(!import.meta.env.DEV)throw Error('Local development only');
const city=createCity(false,'Street life study');city.cells={};city.progression.xp=1000;
for(let x=-8;x<=8;x++)for(let z=-7;z<=7;z++){if(x%4===0||z%4===0)city.cells[`${x},${z}`]={x,z,kind:'road',level:1,age:50,occupancy:0};}
for(let x=-7;x<=7;x++)for(let z=-6;z<=6;z++){if(city.cells[`${x},${z}`]||!(Math.abs(x%4)===1||Math.abs(z%4)===1))continue;const kind=(x+z)%7===0?'park':x<0?'residential':(x+z)%3===0?'industrial':'commercial';city.cells[`${x},${z}`]={x,z,kind,level:1,age:50,occupancy:kind==='park'?0:64};}
useGame.getState().set({city,speed:1,lighting:'day',selected:null,tool:'inspect',thoughts:false});createRoot(document.getElementById('root')).render(React.createElement(World));
setInterval(()=>{const s=useGame.getState();if(s.speed){const foot=advancePedestrians(s.city,s.footTraffic,s.traffic,.1);const result=advanceTraffic(s.city,s.traffic,.1,{operational:new Set(Object.keys(s.city.cells)),health:100,fireRisk:0,autoIncidents:false,pedestrianRoads:pedestrianRoadBlocks(foot),pedestrianCrossings:pedestrianCrossings(foot)});useGame.setState({footTraffic:foot,traffic:result.state});}const f=useGame.getState().footTraffic;document.getElementById('stats').textContent=`${f.agents.filter(p=>p.stage==='walking').length} outdoors · ${f.agents.filter(p=>p.stage==='inside').length} inside · ${f.visits} visits · ${f.crossings} crossings`;},100);
document.getElementById('pause').onclick=()=>{const s=useGame.getState();s.set({speed:s.speed?0:1});document.getElementById('pause').textContent=s.speed?'Resume':'Pause';};
document.getElementById('view').onclick=()=>{const p=useGame.getState().footTraffic.agents.find(p=>p.stage==='walking'&&p.index>1&&p.index<p.path.length-2);if(p)window.dispatchEvent(new CustomEvent('city-camera',{detail:{street:{x:p.x,z:p.z}}}));};
document.getElementById('entrance').onclick=()=>{const s=useGame.getState(),p=s.footTraffic.agents.find(p=>p.stage==='walking'&&p.index<=2)||s.footTraffic.agents[0];if(p){const e=buildingEntrance(s.city,s.city.cells[p.home]);if(e)window.dispatchEvent(new CustomEvent('city-camera',{detail:{street:e.outside}}));}};
document.getElementById('overview').onclick=()=>window.dispatchEvent(new CustomEvent('city-camera',{detail:{focus:{x:0,z:0}}}));document.getElementById('night').onclick=()=>{const s=useGame.getState();s.set({lighting:s.lighting==='night'?'day':'night'});};
</script></body></html>
