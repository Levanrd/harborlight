<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Harborlight · Port and airport</title><style>body{margin:0}header{position:fixed;top:18px;left:20px;right:20px;z-index:5;display:flex;align-items:center;gap:12px;background:#f4f6eef0;border-radius:12px;padding:16px 20px;color:#2b4941;font:13px system-ui}button{padding:9px 14px;background:#fff;border:1px solid #acbdb2;border-radius:6px;color:#2b4941}small{margin-left:auto}</style></head><body><div id="root"></div><header><b>HARBORLIGHT / REGIONAL CONNECTIONS</b><button id="airport">Airport</button><button id="port">Seaport</button><button id="close">Closer view</button><button id="pause">Resume</button><button id="night">Day / night</button><small>Local preview · your saved city is untouched</small></header><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {World} from '/src/World.tsx';import {useGame} from '/src/store.ts';import {createShowcaseCity} from '/src/showcase.ts';import {waterEdge} from '/src/simulation.ts';import '/src/style.css';
if(!import.meta.env.DEV)throw Error('Local development only');
useGame.getState().set({city:createShowcaseCity(),speed:0,lighting:'day',selected:null,tool:'inspect'});createRoot(document.getElementById('root')).render(React.createElement(World));
let selected='seaport';const focus=(close=false)=>{const c=Object.values(useGame.getState().city.cells).find(c=>c.kind===selected&&c.regionalRoot===`${c.x},${c.z}`);if(!c)return;const x=selected==='airport'?(c.x+2.5)*8:waterEdge((c.z+1)*8)+3,z=(c.z+(selected==='airport'?1.5:1))*8;window.dispatchEvent(new CustomEvent('city-camera',{detail:close?{street:{x,z}}:{focus:{x:x/8,z:z/8}}}));};
document.getElementById('airport').onclick=()=>{selected='airport';focus();};document.getElementById('port').onclick=()=>{selected='seaport';focus();};document.getElementById('close').onclick=()=>focus(true);
document.getElementById('pause').onclick=()=>{const s=useGame.getState();s.set({speed:s.speed?0:1});document.getElementById('pause').textContent=s.speed?'Resume':'Pause';};document.getElementById('night').onclick=()=>{const s=useGame.getState();s.set({lighting:s.lighting==='night'?'day':'night'});};
setInterval(()=>{const s=useGame.getState();s.advance(.1*s.speed);},100);
</script></body></html>
