<!doctype html><html lang="en"><meta charset="utf-8"><title>Harborlight dashboard sizing</title><style>body{margin:0;background:#142c42;color:white;font:13px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center}button{padding:8px}iframe{border:0;display:block;transform-origin:top left}#result{white-space:pre-wrap}</style><header><b>Dashboard viewport check</b><button data-size="1907,920">Wide desktop</button><button data-size="1280,720">Laptop</button><button data-size="1024,768">Tablet</button><button data-size="390,844">Phone</button><button id="audit">Check overlaps</button></header><output id="result"></output><iframe title="Harborlight responsive viewport" src="/"></iframe><script type="module">
if(!import.meta.env.DEV)throw Error('Development only');const frame=document.querySelector('iframe');function size(w,h){frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+Math.min(1,(innerWidth-12)/w)+')';}size(1280,720);document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>size(...b.dataset.size.split(',').map(Number)));
document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument;const rect=s=>{const e=d.querySelector(s);return e&&e.getClientRects().length?e.getBoundingClientRect():null;};const pairs=[['.selection','.toolbar-area'],['.left-panel','.bottom-left'],['.guide','.climate-control'],['.graphics-control','.bottom-right'],['.toolbar-area','.bottom-right']];document.querySelector('#result').textContent=pairs.map(([a,b])=>{const x=rect(a),y=rect(b);return a+' / '+b+': '+(!x||!y?'hidden':Math.min(x.right,y.right)>Math.max(x.left,y.left)&&Math.min(x.bottom,y.bottom)>Math.max(x.top,y.top)?'OVERLAP':'clear');}).join(' | ');};</script></html>
