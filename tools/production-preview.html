<!doctype html><html lang="en"><meta charset="utf-8"><title>Harborlight · Parallel production playtest</title>
<style>body{overflow:auto!important;background:#19384b!important;padding:24px}header,main{max-width:760px;margin:0 auto 16px;background:#eff6fc;padding:22px;border-radius:18px;color:#30576f}header button{margin:4px;padding:9px;border-radius:6px;background:#dbeefb}header output{display:block;font-size:12px;margin-top:8px}main{position:static!important;width:min(760px,100%)!important;max-height:none!important;overflow:visible!important}h1{font-size:22px}.production-help{font-size:11px}#root{min-height:600px}</style>
<header><h1>Parallel production · disposable test factory</h1><button id="step">Advance 2 active seconds</button><button id="reload">Save & reload fixture</button><button id="reset">Reset five batches</button><output id="notice"></output></header><main id="root" class="modal"></main>
<script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';import {ProductionPanel} from '/src/ProductionPanel.tsx';import {useGame} from '/src/store.ts';import {createCity,build,roadPath,decodeCity} from '/src/simulation.ts';import {emptyProduction} from '/src/production.ts';import {emptyClock} from '/src/gameClock.ts';import '/src/style.css';import '/src/progression.css';import '/src/gameTheme.css';
if(!import.meta.env.DEV)throw Error('Local development preview only');
function reset(){let city=createCity(false,'Production study');city.progression.xp=1000;city=build(city,'road',roadPath({x:-2,z:0},{x:4,z:0})).city;for(const [kind,x,z]of [['utility',0,1],['industrial',2,1]])city=build(city,kind,[{x,z}]).city;city.cells['2,1']={...city.cells['2,1'],age:20,occupancy:16,factoryTier:3};city.production={...emptyProduction(),inventory:{wood:8,metal:8,stone:8,planks:0,nails:0,bricks:0}};useGame.getState().set({city,speed:0,clock:emptyClock()});for(const material of ['bricks','wood','nails','planks','metal'])useGame.getState().manageProduction({type:'queue',factory:'2,1',material});}
reset();createRoot(document.getElementById('root')).render(React.createElement(ProductionPanel,{initialFactory:'2,1',chooseIndustry:()=>{},focus:()=>{},overlay:()=>{}}));
document.getElementById('step').onclick=()=>{for(let i=0;i<20;i++)useGame.getState().advance(.1);};document.getElementById('reload').onclick=()=>{const s=useGame.getState();s.set({city:decodeCity(JSON.parse(JSON.stringify(s.city))),notice:'Fixture saved and reloaded; all slot timers retained.'});};document.getElementById('reset').onclick=reset;
setInterval(()=>{const s=useGame.getState();if(s.speed)s.advance(.1*s.speed);document.getElementById('notice').textContent=useGame.getState().notice;},100);
</script></html>
