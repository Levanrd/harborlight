<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harborlight · Recreation study</title>
<style>body{margin:0;overflow:hidden;background:#b8c9cc;color:#263d40;font:13px system-ui}canvas{display:block}header{position:absolute;left:16px;top:16px;padding:12px 16px;background:#f5f6eeeF;border-radius:8px;max-width:550px}h1{font-size:20px;margin:3px 0 8px}p{margin:6px 0}button{padding:7px 10px;border:1px solid #afbdba;border-radius:5px;background:#fff;color:#234740;cursor:pointer}output{display:block;margin-top:8px}</style>
<style>@media(max-width:700px){header{left:8px;top:8px;padding:8px 10px;max-width:calc(100% - 36px)}header p{display:none}h1{font-size:14px;margin:0 0 5px}button{padding:4px 6px;font-size:11px}output{font-size:10px;margin-top:5px}}</style>
<header><h1>People at play.</h1><p>Actual city models · drag to orbit · wheel to zoom at the pointer · double-click to focus · no city saves accessed.</p><nav><button data-kind="sports">Soccer field</button> <button data-kind="waterpark">Pools</button> <button data-kind="playground">Playground</button> <button data-kind="largepark">Park</button> <button data-kind="resort">Resort</button> <button id="night" aria-pressed="false">Night lights</button> <button id="ball" aria-pressed="false">Follow ball</button> <button id="close">People close-up</button> <button id="follow" aria-pressed="false">Follow player</button> <button id="next">Next player</button> <button id="slow" aria-pressed="false">Slow motion</button> <button id="zoom-in" aria-label="Zoom in">Zoom +</button> <button id="zoom-out" aria-label="Zoom out">Zoom −</button> <button id="pause">Pause</button> <button id="reduced">Reduced motion</button></nav><output id="match-info"></output><output id="stats"></output></header>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {PlaceVisuals} from '/src/placeVisuals.ts';import {drawRecreation} from '/src/recreationModels.ts';import {createSky,createSurface,batchScenery,disposeBatches} from '/src/cityVisuals.ts';import {FacilityLighting} from '/src/facilityLighting.ts';import {StreetFurniture} from '/src/streetFurniture.ts';
if(!import.meta.env.DEV)throw Error('Development preview only');
const scene=new THREE.Scene();scene.background=new THREE.Color('#b8c9cc');scene.environment=createSky();scene.environmentIntensity=.5;
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.05,200),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.7;controls.maxDistance=70;controls.zoomToCursor=true;
const ambient=new THREE.HemisphereLight('#deecf5','#687366',2);scene.add(ambient);const sun=new THREE.DirectionalLight('#fff1d9',2.5);sun.position.set(-10,20,13);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});sun.shadow.normalBias=.015;scene.add(sun);
const cube=new THREE.BoxGeometry(),cylinder=new THREE.CylinderGeometry(1,1,1,24),materials=new Map(),water=createSurface('water',2),grass=createSurface('grass',5);
const material=color=>{if(!materials.has(color))materials.set(color,new THREE.MeshStandardMaterial({color,roughness:color==='#6f9698'?.25:.85,map:color==='#6f9698'?water:['#90b476','#6c9c6e','#79aa78','#70a271'].includes(color)?grass:null}));return materials.get(color);};
const box=(g,x,y,z,w,h,d,color)=>{const m=new THREE.Mesh(cube,material(color));m.position.set(x,y+h/2,z);m.scale.set(w,h,d);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;};
const tree=(g,x,z,s=1)=>{box(g,x,.4,z,.12,s*1.8,.12,'#776752');const m=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),material('#5e8758'));m.position.set(x,s*2,z);m.scale.set(s,s*1.1,s);g.add(m);};
const kit={box,cylinder,roof:cube,material,tree},places=new PlaceVisuals(scene,kit),facilityLighting=new FacilityLighting(),streetLighting=new StreetFurniture(scene),staticGroup=new THREE.Group();scene.add(staticGroup);box(scene,4,.1,4,70,.15,70,'#80957c');
let kind='sports',time=0,playing=true,reduced=false,last=0,frames=0,start=0,following=false,trackingBall=false,player=0,slow=false,night=false,followPoint;
const positions={sports:{eye:[25,22,30],target:[8,.7,4],close:[3.4,1.6,4.3],look:[2,1.13,1.95]},waterpark:{eye:[26,23,31],target:[8,.8,4],close:[7,2.7,9],look:[6,1,4]},playground:{eye:[20,17,25],target:[4,1,4],close:[4.4,1.5,6.3],look:[2.75,1.0,3]},largepark:{eye:[28,25,32],target:[8,.7,8],close:[12,2.2,14],look:[11,1.1,12]},resort:{eye:[11,10,14],target:[0,1,0],close:[5,1.8,4],look:[2.7,.8,.6]}};
function show(next){kind=next;following=trackingBall=false;followPoint=undefined;for(const id of ['follow','ball']){document.getElementById(id).setAttribute('aria-pressed','false');document.getElementById(id).disabled=kind!=='sports';}document.getElementById('next').disabled=kind!=='sports';disposeBatches(staticGroup);places.beginRebuild();facilityLighting.beginRebuild();const c={x:0,z:0,kind:kind==='resort'?'commercial':kind,coastal:kind==='resort'?'resort':undefined,level:2,age:40,occupancy:24};if(kind==='sports')drawRecreation(c,staticGroup,box,tree);if(kind==='waterpark')places.waterpark(c,staticGroup);else if(kind==='resort')places.coastal(c,staticGroup);else places.park(c,staticGroup);facilityLighting.draw(c,staticGroup);batchScenery(staticGroup);streetLighting.setFacilityLights(facilityLighting.sources);places.endRebuild();camera.position.set(...positions[kind].eye);controls.target.set(...positions[kind].target);}
document.getElementById("night").onclick=e=>{night=!night;e.target.setAttribute("aria-pressed",String(night));e.target.textContent=night?"Night lights: on":"Night lights";};function playerCloseUp(){places.update(time,reduced);const point=places.personView('run',player);if(!point)return;following=true;trackingBall=false;followPoint=point;controls.target.copy(point);camera.position.copy(point).add(new THREE.Vector3(1.6,.48,2.3));document.getElementById('follow').setAttribute('aria-pressed','true');document.getElementById('ball').setAttribute('aria-pressed','false');}
document.getElementById('ball').onclick=()=>{if(trackingBall){trackingBall=false;document.getElementById('ball').setAttribute('aria-pressed','false');return;}places.update(time,reduced);const match=places.soccerView();if(!match)return;following=false;trackingBall=true;followPoint=match.ball.clone().add(new THREE.Vector3(0,.45,0));controls.target.copy(followPoint);camera.position.copy(followPoint).add(new THREE.Vector3(3.4,4.4,6.8));document.getElementById('ball').setAttribute('aria-pressed','true');document.getElementById('follow').setAttribute('aria-pressed','false');};
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>show(b.dataset.kind));document.getElementById('close').onclick=()=>{if(kind==='sports'){playerCloseUp();return;}camera.position.set(...positions[kind].close);controls.target.set(...positions[kind].look);};document.getElementById('follow').onclick=()=>{if(following){following=false;followPoint=undefined;document.getElementById('follow').setAttribute('aria-pressed','false');}else playerCloseUp();};document.getElementById('next').onclick=()=>{player=(player+1)%6;playerCloseUp();};document.getElementById('slow').onclick=e=>{slow=!slow;e.target.setAttribute('aria-pressed',String(slow));e.target.textContent=slow?'Slow motion: on':'Slow motion';};document.getElementById('pause').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Resume';};document.getElementById('reduced').onclick=e=>{reduced=!reduced;e.target.textContent=reduced?'Reduced motion: on':'Reduced motion';};show('sports');
const zoom=factor=>{const offset=camera.position.clone().sub(controls.target);offset.setLength(THREE.MathUtils.clamp(offset.length()*factor,controls.minDistance,controls.maxDistance));camera.position.copy(controls.target).add(offset);controls.update();};
document.getElementById('zoom-in').onclick=()=>zoom(.75);document.getElementById('zoom-out').onclick=()=>zoom(1/.75);
renderer.domElement.addEventListener('dblclick',e=>{const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObjects(scene.children,true)[0];if(!hit)return;const offset=camera.position.clone().sub(controls.target);offset.setLength(Math.max(controls.minDistance,Math.min(8,offset.length()*.45)));controls.target.copy(hit.point);camera.position.copy(hit.point).add(offset);controls.update();});
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)time+=dt*(slow?.35:1);places.update(time,reduced);facilityLighting.update(night?1:0);streetLighting.update(time,night?1:0,camera);ambient.intensity=night?.30:2;sun.intensity=night?.10:2.5;scene.environmentIntensity=night?.09:.5;scene.background.set(night?"#122539":"#b8c9cc");const match=places.soccerView();if(following||trackingBall){let point=following?places.personView('run',player):match?.ball.clone().add(new THREE.Vector3(0,.45,0));if(point&&followPoint){if(trackingBall)point=followPoint.clone().lerp(point,1-Math.exp(-dt*7));const delta=point.clone().sub(followPoint);camera.position.add(delta);controls.target.add(delta);followPoint=point;}}controls.update();renderer.render(scene,camera);frames++;if(now-start>250){document.getElementById('match-info').textContent=match?`3 v 3 · Red ${match.score[0]} : ${match.score[1]} Blue · ${match.event}`:'';}if(now-start>1000){document.getElementById('stats').textContent=`${kind}${following?' · following player '+(player+1):trackingBall?' · following ball':''} · ${renderer.info.render.calls} draw calls · ${Math.round(frames*1000/(now-start))} FPS`;frames=0;start=now;}}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
